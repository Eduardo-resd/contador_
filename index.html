<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contagem regressiva até Litorar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: 'Inter', system-ui, sans-serif;
    background: radial-gradient(circle at 30% 20%, #1e3a5f, #0b1220 70%);
    color: #f1f5f9; padding: 24px;
  }
  .wrap { text-align: center; width: 100%; max-width: 760px; }
  h1 { font-size: clamp(1.1rem, 3vw, 1.6rem); font-weight: 600; color: #cbd5e1; margin-bottom: 8px; }
  .target { font-size: clamp(.85rem, 2.4vw, 1rem); color: #94a3b8; margin-bottom: 32px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(8px, 2vw, 18px); }
  .box {
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
    border-radius: 16px; padding: clamp(14px, 4vw, 28px) 6px;
    backdrop-filter: blur(6px);
  }
  .num { font-size: clamp(2rem, 9vw, 4.5rem); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .lbl { margin-top: 10px; font-size: clamp(.7rem, 2.2vw, .95rem); text-transform: uppercase; letter-spacing: .12em; color: #94a3b8; }
  .done { display: none; font-size: clamp(1.6rem, 6vw, 3rem); font-weight: 800; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Contagem regressiva para Litorarmos</h1>
  <div class="target" id="target"></div>
  <div class="grid" id="grid">
    <div class="box"><div class="num" id="d">0</div><div class="lbl">Dias</div></div>
    <div class="box"><div class="num" id="h">00</div><div class="lbl">Horas</div></div>
    <div class="box"><div class="num" id="m">00</div><div class="lbl">Minutos</div></div>
    <div class="box"><div class="num" id="s">00</div><div class="lbl">Segundos</div></div>
  </div>
  <div class="done" id="done">🎉 Chegou o dia 08/12!</div>
</div>
<script>
  // Meia-noite (00:00) do dia 08/12, no fuso horário do dispositivo
  const now0 = new Date();
  let year = now0.getFullYear();
  let target = new Date(year, 11, 8, 0, 0, 0);
  // Se já passou mais de um dia após a data deste ano, conta para o próximo ano
  if (now0 - target > 24 * 3600 * 1000) target = new Date(year + 1, 11, 8, 0, 0, 0);

  document.getElementById('target').textContent =
    'Até 00:00 de ' + target.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });

  const pad = n => String(n).padStart(2, '0');
  function tick() {
    let diff = Math.floor((target - new Date()) / 1000);
    if (diff <= 0) {
      ['d','h','m','s'].forEach(id => document.getElementById(id).textContent = id === 'd' ? '0' : '00');
      document.getElementById('done').style.display = 'block';
      return;
    }
    const d = Math.floor(diff / 86400); diff %= 86400;
    const h = Math.floor(diff / 3600); diff %= 3600;
    const m = Math.floor(diff / 60); const s = diff % 60;
    document.getElementById('d').textContent = d;
    document.getElementById('h').textContent = pad(h);
    document.getElementById('m').textContent = pad(m);
    document.getElementById('s').textContent = pad(s);
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
